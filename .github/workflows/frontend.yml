name: Frontend CI/CD

on:
  push:
    branches:
      - Interview-User

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3️⃣ Setup gcloud
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GKE_PROJECT }}

      # 4️⃣ Install GKE auth plugin
      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      # 5️⃣ Configure Docker for GCR
      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      # 6️⃣ Build Docker image
      - name: Build Docker image
        run: |
          echo "VITE_BUILD_ID=${{ github.sha }}" > .env.production
          docker build --no-cache \
            -t gcr.io/${{ secrets.GKE_PROJECT }}/user-frontend:${{ github.sha }} .

      # 7️⃣ Push image
      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.GKE_PROJECT }}/user-frontend:${{ github.sha }}

      # 8️⃣ Connect to GKE
      - name: Connect to GKE
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER }} \
            --zone ${{ secrets.GKE_ZONE }} \
            --project ${{ secrets.GKE_PROJECT }}

      # 9️⃣ Deploy & FORCE refresh
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/user-frontend \
            user-frontend=gcr.io/${{ secrets.GKE_PROJECT }}/user-frontend:${{ github.sha }}

          kubectl rollout restart deployment user-frontend
          kubectl rollout status deployment user-frontend
