name: Frontend CI/CD

on:
  push:
    branches:
      - Interview-User

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GKE_PROJECT }}

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      # 🔥 UNIQUE IMAGE TAG
      - name: Build Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GKE_PROJECT }}/user-frontend:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.GKE_PROJECT }}/user-frontend:${{ github.sha }}

      - name: Connect to GKE
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER }} \
            --zone ${{ secrets.GKE_ZONE }} \
            --project ${{ secrets.GKE_PROJECT }}

      # 🔥 Force deployment update
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/user-frontend \
            user-frontend=gcr.io/${{ secrets.GKE_PROJECT }}/user-frontend:${{ github.sha }}

          kubectl rollout status deployment/user-frontend
